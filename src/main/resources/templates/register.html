<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title th:text="#{register.title}">註冊</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <meta name="_csrf" th:content="${_csrf.token}" />
    <meta name="_csrf_header" th:content="${_csrf.headerName}" />

    <style>
        body { background-color: #f8f9fa; }
        .container {
            max-width: 400px;
            margin-top: 80px;
            padding: 30px;
            border-radius: 15px;
            background-color: white;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        h2 { text-align: center; margin-bottom: 25px; }
        .invalid-feedback {
            display: block;
            font-weight: 500;
            transition: all 0.3s ease;
        }
    </style>
</head>
<body>

<div class="container">
    <h2 th:text="#{register.title}">註冊帳號</h2>

    <form id="registerForm" novalidate>
        <!-- 帳號 -->
        <div class="mb-3">
            <label for="username" class="form-label" th:text="#{label.username}">帳號：</label>
            <input type="text" id="username" name="username" class="form-control" aria-describedby="usernameFeedback">
            <div id="usernameMsg" class="form-text"></div>
            <div id="usernameFeedback" class="invalid-feedback"></div>
        </div>

        <!-- 密碼 -->
        <div class="mb-3">
            <label for="password" class="form-label" th:text="#{label.password}">密碼：</label>
            <input type="password" id="password" name="password" class="form-control" aria-describedby="passwordFeedback">
            <div id="passwordFeedback" class="invalid-feedback"></div>
        </div>

        <div class="d-grid">
            <button type="submit" class="btn btn-primary" th:text="#{register.button}">註冊</button>
        </div>
    </form>

    <div id="resultMsg" class="mt-3 text-center fw-bold"></div>

    <div class="text-center mt-3">
        <a href="/index" class="link-secondary" th:text="#{back.index}">回首頁</a>
    </div>
</div>

<script th:inline="javascript">
    const usernameInput = document.getElementById("username");
    const usernameMsg = document.getElementById("usernameMsg");
    const usernameFeedback = document.getElementById("usernameFeedback");
    const passwordInput = document.getElementById("password");
    const passwordFeedback = document.getElementById("passwordFeedback");
    const resultMsg = document.getElementById("resultMsg");

    let usernameAvailable = false;

    usernameInput.addEventListener("input", () => {
        const username = usernameInput.value.trim();
        usernameInput.classList.remove("is-invalid");
        usernameFeedback.textContent = "";
        usernameMsg.textContent = "";

        if (!username) return;

        fetch(`/auth/checkUsername?username=${username}`)
            .then(res => res.json())
            .then(exists => {
                if (exists) {
                    usernameMsg.textContent = "❌ " + /*[[#{register.username.taken}]]*/ "帳號有人使用";
                    usernameMsg.style.color = "red";
                    usernameAvailable = false;
                } else {
                    usernameMsg.textContent = "✅ " + /*[[#{register.username.ok}]]*/ "帳號可以申請";
                    usernameMsg.style.color = "green";
                    usernameAvailable = true;
                }
            });
    });

    document.getElementById("registerForm").addEventListener("submit", function (event) {
        event.preventDefault();

        const username = usernameInput.value.trim();
        const password = passwordInput.value.trim();

        resultMsg.textContent = "";
        usernameInput.classList.remove("is-invalid");
        passwordInput.classList.remove("is-invalid");
        usernameFeedback.textContent = "";
        passwordFeedback.textContent = "";

        let valid = true;

        if (!usernameAvailable) {
            usernameFeedback.textContent = /*[[#{register.username.invalid}]]*/ "請更換帳號名稱。";
            usernameInput.classList.add("is-invalid");
            valid = false;
        }

        if (!password) {
            passwordFeedback.textContent = /*[[#{register.password.required}]]*/ "請輸入密碼。";
            passwordInput.classList.add("is-invalid");
            valid = false;
        }

        if (!valid) return;

        const csrfToken = document.querySelector('meta[name="_csrf"]').getAttribute('content');
        const csrfHeader = document.querySelector('meta[name="_csrf_header"]').getAttribute('content');

        fetch("/auth/register", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                [csrfHeader]: csrfToken
            },
            body: JSON.stringify({ username, password })
        })
        .then(res => {
            if (res.ok) {
                resultMsg.textContent = "✅ " + /*[[#{register.success}]]*/ "註冊成功，返回登入頁";
                resultMsg.style.color = "green";
                setTimeout(() => window.location.href = "/index", 1500);
            } else {
                return res.text().then(text => {
                    resultMsg.textContent = "❌ " + (text || /*[[#{register.fail}]]*/ "註冊失敗");
                    resultMsg.style.color = "red";
                });
            }
        })
        .catch(err => {
            resultMsg.textContent = "⚠️ " + /*[[#{register.error}]]*/ "註冊發生錯誤：" + err;
            resultMsg.style.color = "red";
        });
    });
</script>

</body>
</html>
