<div th:fragment="content">
  <div class="container">
    <div class="row justify-content-center mb-4">
      <div class="col-xl-10 text-center">
        <div th:if="${isAdmin}">
  <button class="btn btn-warning mb-3" onclick="sendTestMail()">
    📧 <span th:text="#{shop.sendTestMail}">寄送測試信</span>
  </button>
</div>


        <h4 class="fw-bold mb-3" th:text="#{section.shop}">購物專區</h4>

        <div class="row justify-content-center" id="productList">
          <div th:each="product : ${products}" class="col-6 col-md-3 col-lg-2 mb-4">
            <div class="card h-100">
              <img th:src="${product.imageUrl != null ? product.imageUrl : '/images/placeholder.png'}"
                   th:attr="data-bs-toggle='tooltip', data-bs-placement='top', title=${product.description}"
                   class="card-img-top"
                   style="height: 120px; object-fit: cover;"
                   th:alt="#{shop.image}"
                   onerror="this.src='/images/placeholder.png'">
              <div class="card-body text-center p-2 d-flex flex-column justify-content-between">
                <p class="card-title fw-semibold mb-1" style="font-size: 14px; word-break: break-word;">
                  <span th:text="${product.name}">商品名稱</span>
                </p>
                <div class="fw-bold text-danger mb-1">
                  NT$ <span th:text="${product.price}">0</span>
                </div>
                <div class="input-group mb-2">
                  <input type="number"
                         th:id="'qty-' + ${product.id}"
                         class="form-control text-center"
                         value="0" min="1"
                         th:attr="max=${product.stock}" />
                </div>
                <button class="btn btn-primary w-100"
                        th:attr="data-id=${product.id}"
                        th:data-name="${product.name}"
                        th:data-price="${product.price}"
                        th:data-stock="${product.stock}"
                        onclick="addToCart(this)">
                  🛒 <span th:text="#{shop.addToCart}">加入購物車</span>
                </button>
                <button class="btn btn-danger btn-sm mt-2"
        th:if="${isAdmin}"
        th:attr="onclick=|deleteProduct(${product.id})|">
  <span th:text="#{shop.removeFromCart}">刪除</span>
</button>

              </div>
            </div>
          </div>
        </div>

        <!-- ✅ 新增商品表單 -->
        <div th:if="${isAdmin}">
        <h4 class="fw-bold mt-5" th:text="#{shop.addProduct}">新增商品</h4>
        <form id="addProductForm" onsubmit="event.preventDefault(); submitNewProduct();" class="mx-auto" style="max-width: 1040px;">
          <div class="row justify-content-center">
            <!-- 圖片預覽 -->
            <div class="col-md-3 text-center">
              <label class="form-label" th:text="#{shop.image.preview}">圖片預覽</label><br>
              <img id="previewImage"
                   src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///ywAAAAAAQABAAACAUwAOw=="
                   th:alt="#{shop.image.preview}"
                   style="width: 150px; height: 150px; object-fit: cover; background-color: #eee; border: 1px solid #ccc;"
                   onerror="this.src='/images/placeholder.png'">
              <div class="input-group justify-content-center mt-2">
                <label class="input-group-text btn btn-outline-dark" for="imageInput" th:text="#{shop.uploadImage}">上傳圖片</label>
                <input type="file" class="form-control d-none" id="imageInput" onchange="previewProductImage(event)" accept="image/*">
              </div>
            </div>

            <!-- 表單欄位 -->
            <div class="col-md-9">
              <div class="row">
                <div class="col-md-6 mb-2">
                  <label for="productName" class="form-label" th:text="#{shop.name}">商品名稱</label>
                  <input type="text" id="productName" class="form-control" maxlength="20" th:placeholder="#{form.productName.placeholder}">
                  <div id="nameError" class="text-danger small" style="min-height: 1.5em;"></div>
                </div>
                <div class="col-md-6 mb-2">
                  <label for="productPrice" class="form-label" th:text="#{shop.price}">價格</label>
                  <input type="number" id="productPrice" class="form-control" min="1" step="1" th:placeholder="#{form.price.placeholder}">
                  <div id="priceError" class="text-danger small" style="min-height: 1.5em;"></div>
                </div>
                <div class="col-md-6 mb-2">
                  <label for="productDescription" class="form-label" th:text="#{shop.description}">商品敘述</label>
                  <input type="text" id="productDescription" class="form-control" maxlength="100" th:placeholder="#{form.productDescription.placeholder}">
                </div>
                <div class="col-md-6 mb-2">
                  <label for="productStock" class="form-label" th:text="#{form.stock.label}">存貨</label>
                  <input type="number" id="productStock" class="form-control" min="0" step="1" th:placeholder="#{form.stock.placeholder}">
                  <div id="stockError" class="text-danger small" style="min-height: 1.5em;"></div>
                </div>
              </div>
              <div class="text-center mt-3">
                <button type="submit" class="btn btn-success">
                  ➕ <span th:text="#{shop.addProduct}">新增商品</span>
                </button>
              </div>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>
    <!-- ✅ 🛒 右側浮動購物車 -->
    <div id="cartSidebar" class="d-none d-md-block"
         style="position: fixed; top: 180px; right: 30px; width: 260px; z-index: 999;">
      <div class="card">
        <div class="card-header bg-primary text-white" th:text="#{cart.title}">🛒 購物車</div>
        <ul id="cartItems" class="list-group list-group-flush"></ul>
        <div class="card-body">
          <div class="mb-2 text-end fw-bold">
            <span th:text="#{cart.subtotal.label}">小計：</span><span id="cartTotal">$0</span>
          </div>
          <div class="d-grid gap-2">
            <button class="btn btn-sm btn-outline-danger" onclick="clearCart()" th:text="#{cart.clear}">🗑 清空</button>
            <button class="btn btn-sm btn-success" onclick="checkout()" th:text="#{cart.checkout}">💳 結帳</button>
          </div>
        </div>
      </div>
    </div>

    <!-- ✅ 🧾 結帳 Modal -->
    <!-- ✅ 結帳彈窗 Fragment -->
<div th:fragment="checkoutModal">
  <div class="modal fade" id="checkoutModal" tabindex="-1" aria-labelledby="checkoutModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">

        <div class="modal-header">
          <h5 class="modal-title" id="checkoutModalLabel" th:text="#{checkout.title}">🧾 結帳資訊</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="#{checkout.close}"></button>
        </div>

        <div class="modal-body">
          <form id="checkoutForm" class="needs-validation" novalidate>
            <!-- 姓名 -->
            <div class="mb-2">
              <label class="form-label" th:text="#{form.name.label}">👤 姓名（中文）</label>
              <input type="text" id="buyerName" class="form-control" required pattern="^[\u4e00-\u9fa5]{2,10}$" th:placeholder="#{form.name.placeholder}">
              <div class="invalid-feedback" th:text="#{form.name.invalid}">請輸入有效的中文姓名（2~10字）</div>
            </div>

            <!-- 電話 -->
            <div class="mb-2">
              <label class="form-label" th:text="#{form.phone.label}">📞 電話</label>
              <input type="tel" id="buyerPhone" class="form-control" required pattern="^[0-9]{8,15}$" th:placeholder="#{form.phone.placeholder}">
              <div class="invalid-feedback" th:text="#{form.phone.invalid}">請輸入正確的電話號碼</div>
            </div>

            <!-- Email -->
            <div class="mb-3">
              <label for="checkoutEmail" class="form-label" th:text="#{form.email.label}">電子信箱</label>
              <input type="email" class="form-control" id="checkoutEmail" th:placeholder="#{form.email.placeholder}" required>
              <div class="invalid-feedback" th:text="#{form.email.invalid}">請輸入正確 Email 格式</div>
            </div>

            <!-- 取貨地點 -->
            <div class="mb-3">
              <label class="form-label" th:text="#{form.pickup.label}">🏪 請選擇取貨地點</label>
              <select id="pickupLocation" class="form-select" required>
                <option value="" disabled selected th:text="#{form.pickup.select}">請選擇</option>
                <option value="台北車站 7-11" th:text="#{form.pickup.taipei}">台北車站 7-11</option>
                <option value="板橋站 全家" th:text="#{form.pickup.banciao}">板橋站 全家</option>
                <option value="中山站 7-11" th:text="#{form.pickup.zhongshan}">中山站 7-11</option>
                <option value="忠孝復興站 全家" th:text="#{form.pickup.fuxing}">忠孝復興站 全家</option>
              </select>
              <div class="invalid-feedback" th:text="#{form.pickup.invalid}">請選擇取貨地點</div>
            </div>

            <!-- 商品清單 -->
            <div class="mb-3">
              <label class="form-label" th:text="#{checkout.summary.label}">🛍 購買商品</label>
              <div id="checkoutSummary" class="border p-2 rounded bg-light"></div>
            </div>

            <!-- 信用卡號 -->
            <div class="mb-2">
              <label class="form-label" th:text="#{form.cardNumber.label}">💳 信用卡號碼</label>
              <input type="text" id="cardNumber" class="form-control"
                     inputmode="numeric" maxlength="23"
                     th:placeholder="#{form.cardNumber.placeholder}"
                     required pattern="(?:[0-9][ ]?){12,23}">
              <div class="invalid-feedback" th:text="#{form.cardNumber.invalid}">請輸入有效卡號（12~19 位數字）</div>
            </div>

            <!-- 安全碼 -->
            <div class="mb-3">
              <label class="form-label" th:text="#{form.cvv.label}">🔒 安全碼</label>
              <input type="password" id="cardCVV" class="form-control" required pattern="[0-9]{3}" th:placeholder="#{form.cvv.placeholder}">
              <div class="invalid-feedback" th:text="#{form.cvv.invalid}">請輸入 3 位數安全碼</div>
            </div>
          </form>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal" th:text="#{form.cancel}">取消</button>
          <button type="button" class="btn btn-success" onclick="confirmCheckout()" th:text="#{form.confirmPayment}">✅ 確認付款</button>
        </div>

      </div>
    </div>
  </div>
</div>

          </form>
        </div>
      </div>
    </div>
  </div>
</div>
