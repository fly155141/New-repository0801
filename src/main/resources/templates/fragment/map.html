<div th:fragment="content">
    <style>
        /* ✅ CSS 整合 */
        #mapArea {
            width: 100%;
            max-width: 1200px;
            margin: auto;
            background-color: #f8f9fa;
            border: 1px solid #ccc;
            position: relative;
        }

        #mrtMap {
            width: 100%;
            height: auto;
            display: block;
        }

        circle.station-dot {
            fill: #2c3e50;
            stroke: #ffffff;
            stroke-width: 1.5px;
            cursor: pointer;
        }

        circle.highlight-start {
            fill: #28a745 !important;
        }

        circle.highlight-end {
            fill: #dc3545 !important;
        }

        line.route-line {
            stroke: #007bff;
            stroke-width: 3px;
            stroke-linecap: round;
        }

        text.station-label {
            font-size: 12px;
            font-family: 'Noto Sans CJK TC', sans-serif;
            text-anchor: middle;
            fill: #000;
            pointer-events: none;
        }

        circle.station-dot:hover + text.station-label {
            font-weight: bold;
            fill: #007bff;
        }
    </style>

    <div class="container-fluid">
    <!-- ✅ 多國語系標題 -->
    <h3 class="text-center mb-4" th:text="#{section.map}">自製地圖 - 收藏路線展示</h3>

    <div class="row">
        <!-- ✅ 我的收藏區塊 -->
        <div class="col-md-4">
    <h5 th:text="#{map.favorites}">我的收藏</h5>
    <ul id="favoriteList" class="list-group">
        <li class="list-group-item d-flex justify-content-between align-items-center">
            <span>永寧 ➜ 古亭</span>
            <button type="button"
        class="btn btn-sm btn-outline-primary show-route-btn"
        onclick="showRoute('永寧', '古亭')"
        th:text="#{map.showRoute}"
        th:attr="data-default=#{map.showRoute}">
    顯示路線
</button>

        </li>
    </ul>
</div>


            <!-- 右側：地圖區 -->
